[package]
name = "ta-assistant"
version = "0.2.0"
description = "A local-first TA assistant desktop app"
authors = ["Abdullah (PandaX185)"]
edition = "2021"

[lib]
name = "ta_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4"] }

# Desktop-only: the global-hotkey crate underneath has no Android/iOS support.
# Gated here (real target cfgs — cfg(desktop) is invisible to Cargo's resolver)
# so Android/iOS builds never compile this dependency.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
